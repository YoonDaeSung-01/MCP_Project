<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 
    CSP 설정: 
    - default-src 'none' (기본 모든 접근 차단)
    - script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net (Pyodide 라이브러리 및 Wasm eval)
    - connect-src https://cdn.jsdelivr.net (Pyodide Wasm 및 파이썬 패키지 다운로드)
    - worker-src 'self' blob: (Pyodide 웹 워커 스크립트)
    - style-src 'unsafe-inline'
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'unsafe-inline';" />
  <title>Python Runtime Host (Isolated Origin)</title>
  <style>
    body {
      margin: 0;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      color: #666;
      background: #fafafa;
    }
    #status {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="status">Runtime Initializing...</div>
  <script src="./host.js"></script>
</body>
</html>
